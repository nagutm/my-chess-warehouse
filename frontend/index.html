<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Warehouse Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header>
      <h1>Chess Warehouse</h1>
      <p class="intro">A small, static dashboard. API base injected at build time into <code>window.__API_BASE__</code>.</p>
    </header>

    <section class="card controls">
      <div class="row">
        <label>From: <input type="date" id="from-date"></label>
        <label>To: <input type="date" id="to-date"></label>
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="status-row">
        <div id="loading" class="muted">Idle</div>
        <div id="error" class="error" hidden></div>
      </div>
    </section>

    <section class="card">
      <h2>Rating Trends</h2>
      <canvas id="ratings-chart" height="180"></canvas>
    </section>

    <section class="card two-up">
      <div>
        <h2>Win-rate by Color</h2>
        <div id="color-breakdown" class="stat-cards"></div>
      </div>
      <div>
        <h2>Win-rate by Time Control</h2>
        <canvas id="timecontrol-chart" height="160"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>Top Openings</h2>
      <table id="openings-table">
        <thead>
          <tr><th>Opening</th><th>Games</th><th>Win Rate</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>window.__API_BASE__ = "https://agdcf7hvqd.execute-api.us-east-1.amazonaws.com";</script>

  <!-- Chart.js + date adapter via CDN (no build step required) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
